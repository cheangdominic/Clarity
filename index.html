<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarity Settings</title>
<style>
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 20px;
    background: #f9f9f9;
    color: #111;
    position: relative;
  }

  h1 { margin-bottom: 20px; }

  .section { margin-bottom: 24px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }

  /* Horizontal menu buttons container */
  .menu-options {
    display: flex;
    flex-wrap: nowrap; /* keep in one line, scroll if needed */
    overflow-x: auto;
  }

  .menu-option {
    flex: 0 0 auto; /* do not shrink */
    padding: 10px 16px;
    background: #333333;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s ease;
    user-select: none;
    min-width: 90px;
    text-align: center;
    white-space: nowrap;
  }

  .menu-option:hover {
    background: #555f;
  }

  .menu-option.disabled {
    opacity: 0.3;
  }

  .top-buttons {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
  }

  .top-buttons button {
    padding: 10px 16px;
    background: #333;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.2s ease;
  }

  .top-buttons button:hover {
    background: #555f;
  }
</style>
</head>
<body>

<!-- Top Right Buttons -->
<div class="top-buttons">
  <button id="importState">Import Page State</button>
  <button id="exportState">Export Page State</button>
</div>

<h1>Clarity Settings</h1>

<div class="section">
  <label for="language">Translation Language Preference:</label>
  <select id="language">
    <option value="en">English</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
  </select>
</div>

<div class="section">
  <label>Dark/Light Mode:</label>
  <div class="menu-options">
    <div class="menu-option" style="border-radius: 8px;" id="themeToggle">Toggle Dark/Light</div>
  </div>
</div>

<div class="section">
  <label>Menu Options:</label>
  <div class="menu-options">
    <div class="menu-option" style="border-radius: 8px 0 0 8px; border-right: 1px solid #555;" data-key="summarize">✨ Summarize</div>
    <div class="menu-option" style="border-right: 1px solid #555;" data-key="notes">📝 Notes</div>
    <div class="menu-option" style="border-right: 1px solid #555;" data-key="translate">🌐 Translate</div>
    <div class="menu-option" style="border-right: 1px solid #555;" data-key="history">📋 History</div>
    <div class="menu-option" style="border-radius: 0 8px 8px 0;" data-key="highlight">💡 Highlight</div>
  </div>
</div>

<script>
  // Dark/Light toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    if (document.body.style.backgroundColor === 'rgb(17, 17, 17)') {
      document.body.style.backgroundColor = '#f9f9f9';
      document.body.style.color = '#111';
    } else {
      document.body.style.backgroundColor = '#111';
      document.body.style.color = '#f9f9f9';
    }
  });

  // Menu option toggles: fade/unfade
  document.querySelectorAll('.menu-options .menu-option').forEach(option => {
    if (option.id === 'themeToggle') return;
    option.addEventListener('click', () => {
      option.classList.toggle('disabled');
      const key = option.dataset.key;
      const enabled = !option.classList.contains('disabled');
      console.log(`${key} enabled: ${enabled}`);
    });
  });

  // Language select
  const languageSelect = document.getElementById('language');
  languageSelect.addEventListener('change', () => {
    console.log('Language selected:', languageSelect.value);
  });

  // Import/Export Page State buttons
  document.getElementById('importState').addEventListener('click', () => {
    console.log('Import Page State clicked');
    // Add your import logic here
  });

  document.getElementById('exportState').addEventListener('click', () => {
    console.log('Export Page State clicked');
    // Add your export logic here
  });
</script>

</body>
</html>
